<!DOCTYPE html>
<!-- MemoriesOfTime · 首页「纸张档案」
   视觉风格参考 qimingjiu 的 Trianon（https://github.com/qimingjiu/Trianon），感谢原作者。
   base.css 定义纸张、雾蓝与明暗主题；style.css 负责吊牌导航、信笺首屏和各档案卡片。
   i18n.js 先协商语言，app.js 再渲染导航、项目与社区；<head> 内联脚本仅提前确定主题和语言，避免首屏闪烁。
   opening.css / opening.js 是首次访问的信封开场：同次会话改用短版，点击或 Esc 跳过。-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('mot_theme'); } catch (e) {}
      document.documentElement.dataset.theme = theme === 'light' || theme === 'dark'
        ? theme
        : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

      // 样式生效前先定好语言，避免 <html lang> 与首屏文案不一致
      var query = null, stored = null;
      try { query = new URLSearchParams(location.search).get('lang'); } catch (e) {}
      try { stored = localStorage.getItem('mot_lang'); } catch (e) {}
      var tag = query || stored
        || (navigator.languages && navigator.languages[0])
        || navigator.language || '';
      // 先写入浏览器原始标签，运行时再做归一化；非法值退回默认语言
      document.documentElement.lang = /^[a-z]{2,3}(-[a-z0-9]{2,8})*$/i.test(tag) ? tag : 'zh-CN';
    })();
  </script>
  <title data-i18n="meta.title">MemoriesOfTime - 专注 Minecraft 基岩版生态的开源组织</title>
  <meta name="description" content="MemoriesOfTime 是一个专注于 Minecraft 基岩版生态的开源组织，涵盖服务端核心、开发工具与插件等多个项目。" data-i18n-attr="content:meta.description">
  <link rel="icon" href="https://avatars.githubusercontent.com/u/62042238?v=4&s=64">
  <link rel="canonical" id="canonicalLink" href="https://mot.dev/" data-base="https://mot.dev/">
  <!-- 其余语言的 hreflang 由 i18n 注册表在运行时生成，x-default 固定指向默认语言 -->
  <link rel="alternate" hreflang="x-default" href="https://mot.dev/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="MemoriesOfTime" data-i18n-attr="content:meta.title">
  <meta property="og:description" content="专注 Minecraft 基岩版生态的开源组织" data-i18n-attr="content:meta.ogDescription">
  <meta property="og:url" content="https://mot.dev/">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:image" content="https://mot.dev/assets/images/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="MemoriesOfTime - 专注 Minecraft 基岩版生态的开源组织" data-i18n-attr="content:meta.title">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="MemoriesOfTime" data-i18n-attr="content:meta.title">
  <meta name="twitter:description" content="专注 Minecraft 基岩版生态的开源组织" data-i18n-attr="content:meta.ogDescription">
  <meta name="twitter:image" content="https://mot.dev/assets/images/og-image.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://api.github.com">
  <link rel="preconnect" href="https://avatars.githubusercontent.com">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/opening.css">
</head>
<body>
  <div class="site-opening" id="siteOpening" aria-label="MemoriesOfTime 加载动画">
    <div class="opening-stage" aria-hidden="true">
      <svg class="opening-guide" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
        <line x1="-80" y1="650" x2="1520" y2="280"></line>
        <line x1="-80" y1="663" x2="1520" y2="293"></line>
      </svg>
      <div class="opening-edition">MEMORIES OF TIME <b>—</b> OUVERTURE <b>N°01</b></div>
      <div class="opening-envelope">
        <div class="opening-envelope-back"></div>
        <div class="opening-envelope-letter">
          <span>MEMORIES OF TIME</span>
          <strong>MemoriesOfTime</strong>
          <small>OPEN SOURCE · MINECRAFT BEDROCK</small>
        </div>
        <div class="opening-envelope-pocket"></div>
        <div class="opening-envelope-flap"></div>
        <div class="opening-envelope-seal">MOT</div>
      </div>
      <div class="opening-registration">
        <i></i><i></i><i></i><i></i>
      </div>
      <div class="opening-badge">
        <div class="opening-face opening-face-final">
          <span class="opening-final-kicker">MINECRAFT BEDROCK ECOSYSTEM</span>
          <strong>MemoriesOfTime</strong>
          <span class="opening-final-edition">N°01 · MMXX</span>
          <i class="opening-star opening-star-left">✦</i><i class="opening-star opening-star-right">✦</i>
        </div>
      </div>
      <div class="opening-caption" id="openingCaption">BIENVENUE · MEMORIES OF TIME</div>
    </div>
    <button class="opening-skip" type="button" aria-label="跳过开场动画" data-i18n-attr="aria-label:opening.skip">ESC · CLIC — PASSER <span data-i18n="opening.skip">跳过开场动画</span></button>
  </div>
  <noscript><style>.site-opening{display:none}</style></noscript>

  <div class="bg-decoration" aria-hidden="true">
    <div class="aurora-band ab-1"></div>
    <div class="aurora-band ab-2"></div>
    <div class="aurora-band ab-3"></div>
    <div class="aurora-band ab-4"></div>
  </div>

  <div id="nav-container"></div>
  <main id="app">
    <section class="hero">
      <div class="container">
        <div class="hero-content" style="justify-content: center;">
          <div class="skeleton skeleton-avatar"></div>
          <div style="flex:1;">
            <div class="skeleton skeleton-text" style="width:150px; height:30px;"></div>
            <div class="skeleton skeleton-text" style="width:100px; height:20px; margin-top:12px;"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="assets/js/i18n.js" defer></script>
  <script src="assets/js/app.js" defer></script>
  <script src="assets/js/opening.js" defer></script>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
