<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('mot_theme'); } catch (e) {}
      document.documentElement.dataset.theme = theme === 'light' || theme === 'dark'
        ? theme
        : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

      // 样式生效前先定好语言，避免 <html lang> 与首屏文案不一致
      var query = null, stored = null;
      try { query = new URLSearchParams(location.search).get('lang'); } catch (e) {}
      try { stored = localStorage.getItem('mot_lang'); } catch (e) {}
      var tag = query || stored
        || (navigator.languages && navigator.languages[0])
        || navigator.language || '';
      // 先写入浏览器原始标签，运行时再做归一化；非法值退回默认语言
      document.documentElement.lang = /^[a-z]{2,3}(-[a-z0-9]{2,8})*$/i.test(tag) ? tag : 'zh-CN';
    })();
  </script>
  <title data-i18n="notFound.title">404 - 页面未找到 | MemoriesOfTime</title>
  <meta name="description" content="页面未找到 - MemoriesOfTime" data-i18n-attr="content:notFound.description">
  <meta property="og:title" content="404 - MemoriesOfTime" data-i18n-attr="content:notFound.title">
  <meta property="og:description" content="页面未找到" data-i18n-attr="content:notFound.heading">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="https://avatars.githubusercontent.com/u/62042238?v=4&s=64">
  <link rel="stylesheet" href="/assets/css/base.css">
  <style>
    body {
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 404 page blob positions & colors */
    .blob-1 {
      top: 20%; left: 20%;
      width: 40vw; height: 40vw;
      background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
      animation-delay: 0s;
    }

    .blob-2 {
      bottom: 20%; right: 20%;
      width: 50vw; height: 50vw;
      background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
      animation-delay: -5s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 50px) scale(1.1); }
    }

    .container {
      text-align: center;
      padding: 20px;
      z-index: 1;
    }

    .error-code {
      font-size: 10rem;
      font-weight: 800;
      letter-spacing: -0.05em;
      line-height: 1;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, var(--foreground) 0%, var(--muted-foreground) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0;
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @media (max-width: 768px) {
      .error-code { font-size: 6rem; }
    }

    .error-card {
      display: inline-block;
      padding: 2rem 3rem;
      border-radius: 24px;
      opacity: 0;
      animation: fadeInUp 0.8s 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .error-title {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .error-desc {
      color: var(--muted-foreground);
      margin-bottom: 2rem;
      font-size: 1rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      border: none;
      background: var(--primary);
      color: var(--primary-foreground);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }

    .btn svg {
      width: 18px;
      height: 18px;
      transition: transform 0.2s;
    }

    .btn:hover svg {
      transform: translateX(-4px);
    }
  </style>
</head>
<body>
  <div class="bg-decoration" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <main class="container">
    <div class="error-code">404</div>

    <div class="error-card glass-panel">
      <h1 class="error-title" data-i18n="notFound.heading">页面未找到</h1>
      <p class="error-desc" data-i18n="notFound.description">您访问的页面可能已被移除、更名或暂时不可用。</p>

      <a href="/" class="btn" id="errorBtn">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m12 19-7-7 7-7"/>
          <path d="M19 12H5"/>
        </svg>
        <span data-i18n="notFound.backHome">返回首页</span>
      </a>
    </div>
  </main>

  <script src="/assets/js/i18n.js" defer></script>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
